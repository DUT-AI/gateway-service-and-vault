openapi: 3.1.0
info:
  title: Pure SSO Authentication & Gateway API
  description: API specifications for Central DUT-AI SSO Authentication and Profile Hydration
  version: 1.0.0
paths:
  /api/v1/auth/sso-login:
    options:
      summary: CORS Preflight for SSO Login
      description: Handled at APISIX Gateway edge. Returns allowed origins, methods, and headers.
      responses:
        "200":
          description: Preflight approved
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
            Access-Control-Allow-Credentials:
              schema:
                type: string
    post:
      summary: Authenticate against central DUT-AI SSO IdP
      description: Verifies credentials directly against DUT-AI Manage IdP without local password persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Successful authentication
          headers:
            Set-Cookie:
              description: Secure SSO session cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 1800
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: "Email hoặc mật khẩu SSO không chính xác."

  /api/v1/auth/me:
    get:
      summary: Get profile of authenticated SSO user
      description: Returns identity attributes and permissions of current user from verified token or central IdP.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - email
                  - role
                  - status
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  name:
                    type: string
                    nullable: true
                  role:
                    type: string
                  avatar_url:
                    type: string
                    nullable: true
                  status:
                    type: string
                  role_names:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
        "401":
          description: Missing or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: UnauthorizedError
                  message:
                    type: string
                    example: "Token xác thực không hợp lệ hoặc đã hết hạn trên SSO Manage"

  /api/v1/auth/logout:
    post:
      summary: Clear SSO authentication session
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đăng xuất thành công"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
