name: dut-gateway-vault

services:
  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gateway-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API Gateway Infrastructure (Apache APISIX + etcd)
  # ---------------------------------------------------------------------------
  etcd:
    image: bitnamilegacy/etcd:3.5.11
    container_name: gateway-etcd
    restart: always
    environment:
      - ETCD_ENABLE_V2=true
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - gateway-net

  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: gateway-apisix
    restart: always
    volumes:
      - ./apps/apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apps/apisix/plugins/identity-binding-filter.lua:/usr/local/apisix/apisix/plugins/identity-binding-filter.lua:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080" # APISIX HTTP proxy
      - "9443:9443" # APISIX HTTPS proxy
      - "9180:9180" # APISIX Admin API
    networks:
      - gateway-net

  # ---------------------------------------------------------------------------
  # Application Services (Modular Monolith Processes)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gateway-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8020}:8000"
    environment:
      APP_NAME: ${APP_NAME:-DUT Gateway & Vault API}
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8020}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      DB_ECHO: ${DB_ECHO:-false}
      REDIS_URL: redis://redis:6379/0
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-default-master-key-must-be-changed-in-production-32b}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkeychangemeinproduction32char}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      SSO_DUTAI_BASE_URL: ${SSO_DUTAI_BASE_URL:-https://manage.dutai.io.vn}
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
      APISIX_GATEWAY_URL: ${APISIX_GATEWAY_URL:-http://localhost:9080}
      APISIX_GATEWAY_SSL_URL: ${APISIX_GATEWAY_SSL_URL:-https://localhost:9443}
      APISIX_BACKEND_HOST: api
      APISIX_BACKEND_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      apisix:
        condition: service_started
    networks:
      - gateway-net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: gateway-worker
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-DUT Gateway & Vault Worker}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app_db}
      DB_ECHO: ${DB_ECHO:-false}
      REDIS_URL: redis://redis:6379/0
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-default-master-key-must-be-changed-in-production-32b}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkeychangemeinproduction32char}
      APISIX_ADMIN_URL: http://apisix:9180
      APISIX_ADMIN_KEY: ${APISIX_ADMIN_KEY:-edd1c9f034335f136f87ad84b625c8f1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gateway-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    container_name: gateway-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      - api
    networks:
      - gateway-net

  # ---------------------------------------------------------------------------
  # Unified Reverse Proxy (Traefik)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    container_name: gateway-traefik
    restart: unless-stopped
    ports:
      - "${TRAEFIK_PORT:-8088}:80"
    volumes:
      - ./apps/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./apps/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - web
      - api
      - apisix
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  etcd_data:
