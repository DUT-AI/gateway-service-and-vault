# Apache APISIX Gateway Configuration
apisix:
  node_listen: 9080
  ssl:
    enable: true
    listen_port: 9443
  extra_lua_path: "/usr/local/apisix/plugins/?.lua"
  enable_admin: true
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9090

plugins:
  - real-ip
  - client-control
  - proxy-control
  - request-id
  - cors
  - proxy-rewrite
  - limit-count
  - limit-req
  - identity-binding-filter

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
