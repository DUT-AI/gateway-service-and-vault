[project]
name = "dut-vault-sdk"
version = "0.1.0"
description = "In-memory dynamic configuration SDK and CLI runner for Centralized Vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
dut-vault = "dut_vault_sdk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dut_vault_sdk"]
