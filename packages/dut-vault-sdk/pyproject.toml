[project]
name = "dut-vault-sdk"
version = "0.1.2"
description = "In-memory dynamic configuration SDK, mTLS gateway client, and CLI runner for DUT-AI Vault & Gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["vault", "secrets", "mtls", "gateway", "configuration", "hot-reload"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.scripts]
dut-vault = "dut_vault_sdk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dut_vault_sdk"]
